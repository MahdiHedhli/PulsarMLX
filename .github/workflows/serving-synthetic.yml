name: Serving synthetic qualification

# Qualifies crates/serve-synthetic, which declares its own `[workspace]` and is
# therefore NOT built by `cargo check --workspace` / `cargo test --workspace` in
# the macOS baseline workflow. Before this job existed no CI job compiled or
# tested the crate at all, so a green run on the repository said nothing about
# it (F4).
#
# No path filter, matching the existing workflows. A path-filtered job reports
# success when skipped, which would make this a weaker gate than the baseline it
# sits beside.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # This job is synthetic-only: no checkpoints, weights or tokenizer assets, and
  # no dependency on the F017 native qualification path.
  PULSARMLX_MODEL_GGUF: ""
  CARGO_TERM_COLOR: always

jobs:
  serve-synthetic:
    name: serve-synthetic tests, clippy and SDK smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Prepare owned synthetic graph
        run: |
          GRAPH_ROOT="$RUNNER_TEMP/serving-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "$GRAPH_ROOT"
          mkdir -m 700 "$GRAPH_ROOT/cache" "$GRAPH_ROOT/tmp" "$GRAPH_ROOT/target"
          {
            echo "SERVING_GRAPH_ROOT=$GRAPH_ROOT"
            echo "CARGO_HOME=$GRAPH_ROOT/cache/cargo"
            echo "CARGO_TARGET_DIR=$GRAPH_ROOT/target"
            echo "TMPDIR=$GRAPH_ROOT/tmp"
            echo "PIP_CONFIG_FILE=/dev/null"
            echo "RUSTUP_AUTO_INSTALL=0"
          } >> "$GITHUB_ENV"

      - name: Confirm synthetic boundary
        run: |
          uname -m
          rustc -Vv
          cargo -V
          test -z "$PULSARMLX_MODEL_GGUF"
          # The crate must stay outside the root workspace; if it is ever added
          # there, this job's reason to exist changes and should be revisited.
          python3 -I -B crates/serve-synthetic/tests/test_ci_campaign.py --check-membership

      - name: Formatting
        run: cargo fmt --manifest-path crates/serve-synthetic/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --locked \
            --manifest-path crates/serve-synthetic/Cargo.toml \
            --all-targets -- -D warnings

      - name: Tests
        run: |
          cargo test --locked \
            --manifest-path crates/serve-synthetic/Cargo.toml \
            --no-fail-fast

      - name: Install pinned SDK environment
        run: |
          python3 -m venv "$SERVING_GRAPH_ROOT/sdkvenv"
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/pip" install --no-cache-dir --quiet --disable-pip-version-check \
            -r crates/serve-synthetic/tests/sdk-requirements.txt

      - name: OpenAI SDK loopback smoke
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          PYTHON="$SERVING_GRAPH_ROOT/sdkvenv/bin/python" \
            crates/serve-synthetic/tests/sdk_smoke.sh

      - name: CI interface tests
        run: |
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/python" -I -B \
            crates/serve-synthetic/tests/test_ci_campaign.py
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/python" -I -B \
            crates/serve-synthetic/tests/contention_contract_tests.py
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/python" -I -B \
            crates/serve-synthetic/tests/q_contention_mutation.py
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/python" -I -B \
            crates/serve-synthetic/tests/q_capture_lifecycle_tests.py \
            --mode fake --output "$SERVING_GRAPH_ROOT/lifecycle-fake"

      - name: Mutation guards
        run: |
          "$SERVING_GRAPH_ROOT/sdkvenv/bin/python" -I -B \
            crates/serve-synthetic/tests/ci_campaign.py \
            --root "$SERVING_GRAPH_ROOT/campaign" \
            --source crates/serve-synthetic

      - name: Confirm no model assets were introduced
        run: test -z "$PULSARMLX_MODEL_GGUF"
