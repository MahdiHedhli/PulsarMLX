name: macOS baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-15-arm64:
    name: Apple Silicon workspace baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture and toolchain
        run: |
          uname -m
          sw_vers
          rustc -Vv
          cargo -V
          test "$(uname -m)" = arm64
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

  apple-mlx-small-fixtures:
    name: Apple MLX small-fixture validation
    runs-on: macos-15
    env:
      PULSARMLX_MODEL_GGUF: ""
      PULSAR_REQUIRE_NATIVE_MLX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence records pin the verifier/generator sources at their
          # measured commit. Later verifier changes therefore need history to
          # validate those immutable source hashes in fixture-only CI.
          fetch-depth: 0
      - name: Verify Apple Silicon fixture-only boundary
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test -z "$PULSARMLX_MODEL_GGUF"
          test -f uv.lock
          test -f fixtures/mlx/manifest.json
          test -f fixtures/mlx/routed-moe-v1.json
          test -f docs/validation/mlx-device-smoke.json
          test -f docs/validation/mlx-tensor-fixtures.json
          test -f docs/validation/synthetic-moe-v1.json
      - name: Build pinned official native MLX dependencies
        run: |
          brew install cmake ninja
          scripts/ci/install_native_mlx.sh "$RUNNER_TEMP/pulsar-native-mlx"
          echo "MLX_C_PREFIX=$RUNNER_TEMP/pulsar-native-mlx" >> "$GITHUB_ENV"
          echo "MLX_PREFIX=$RUNNER_TEMP/pulsar-native-mlx" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$RUNNER_TEMP/pulsar-native-mlx/lib" >> "$GITHUB_ENV"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.13.13"
          enable-cache: true
      - name: Sync lockfile-backed MLX environment
        run: |
          uv python install 3.13.13
          uv sync --frozen --python 3.13.13
          .venv/bin/python - <<'PY'
          import platform
          import sys
          from importlib.metadata import version

          assert platform.machine() == "arm64"
          assert sys.version_info[:3] == (3, 13, 13)
          assert version("mlx") == "0.32.0"
          assert version("mlx-metal") == "0.32.0"
          assert version("numpy") == "2.4.5"
          PY
      - name: Validate Feature 002 research methodology
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          scripts/research/setup.sh
          .venv/bin/python -m unittest discover -s scripts/research/tests -v
          python3 scripts/research/validate_evidence.py \
            --schema-dir schemas/research/v1 \
            --input fixtures/research/router-v1/evidence
          python3 scripts/research/verify_package.py \
            --feature 002-qwen-router-parity \
            --fixture-only
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Validate independent Feature 017 oracle
        run: |
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_independent_oracle -v
          .venv/bin/python scripts/research/generate_f017_independent_oracle.py \
            --generator-commit a9779097de029f26be1cb9fde3543cc517ff153e \
            --output specs/017-rust-native-inference-runtime/fixtures/f017-independent-oracle-v1.json \
            --rust-output crates/engine/src/f017_oracle_generated.rs \
            --check
          cargo test -p engine --test f017_independent_oracle -- --nocapture
      - name: Execute required native MLX adapter matrix
        run: |
          echo "PULSAR_REQUIRE_NATIVE_MLX=1; executing native adapter tests (no skip permitted)"
          test -f "$MLX_C_PREFIX/include/mlx/c/mlx.h"
          test -f "$MLX_C_PREFIX/lib/libmlxc.dylib"
          test -f "$MLX_PREFIX/lib/libmlx.dylib"
          cargo test -p stream --test apple_mlx_bridge -- --nocapture
          cargo test -p stream --test apple_metal_bridge -- --nocapture
          cargo test -p f017-runner --lib \
            environment::tests::loaded_library -- --nocapture
      - name: Execute canonical F017 runner projection gate
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute checkpoint-free M1-D real-shaped projection qualification
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_m1d_oracle_finalization \
            scripts.research.tests.test_f017_m1d_attempt3_command -v
          .venv/bin/python scripts/research/generate_f017_m1d_projection_oracle.py \
            --output specs/017-rust-native-inference-runtime/fixtures/f017-m1d-projection-oracle-v1.json \
            --packed-output specs/017-rust-native-inference-runtime/fixtures/f017-m1d-projection-q8-0-v1.bin \
            --check
          cargo test -p f017-runner --test m1d_contract -- --nocapture
          cargo test -p f017-runner --test m1d_projection_native -- --nocapture
          echo "M1-D attempt-3 command gate: config-only launch; historical wrong path rejected; relocated cwd/package exercised"
          echo "M1-D native repeat/order gate: 10 hashes required; divergence and oracle-order negatives executed; no skip"
          test -z "$PULSARMLX_MODEL_GGUF"
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_passes_independent_projection_through_production_adapter \
            -- --exact --nocapture
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute checkpoint-free M1-E real-shaped expert admission
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          echo "M1-E native gate: one expert; 3 matvecs/repeat; 10 repeats; 30 native dispatches; no skip"
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_m1e_package \
            scripts.research.tests.test_f017_m1e_preparer_v3 \
            scripts.research.tests.test_f017_m1e_authorized_launcher \
            scripts.research.tests.test_f017_iq3_decoder_identity \
            scripts.research.tests.test_iq3_xxs_numpy -v
          echo "M1-E preparer/launcher gate: schema v2/future/mixed/stale inputs and unreviewed native loader paths rejected before payload access"
          cargo test -p quant --test iq_reference -- --nocapture
          echo "IQ3_XXS v2 identity gate: minimized order regression; scalar/vector/spec exact; no skip"
          .venv/bin/python scripts/research/generate_f017_m1e_activation.py \
            --output specs/017-rust-native-inference-runtime/fixtures/f017-m1e-activation-v1.json \
            --check
          cargo test -p f017-runner --test m1e_contract -- --nocapture
          cargo test -p f017-runner --test m1e_numerical -- --nocapture
          cargo test -p f017-runner --test m1e_expert_native -- --nocapture
          echo "M1-E canonical v3 integration: updated independent preparer; 10 repeats; 30 native dispatches; no skip"
          echo "M1-E isolation negative: wrong expert/tensor/fixture and one-repeat intermediate divergence rejected"
          echo "M1-D regression remains load-bearing"
          cargo test -p f017-runner --test m1d_contract -- --nocapture
          cargo test -p f017-runner --test m1d_projection_native -- --nocapture
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute checkpoint-free M1-F0 attention/router admission
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          echo "M1-F0 oracle-only gate: layer 3 position 0; 12 attention/router tensors; zero expert access"
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_m1f0_admission -v
          cargo test -p quant \
            tests::m1f0_q5_k_and_q8_0_match_independent_specification_bytes -- --exact --nocapture
          .venv/bin/python scripts/research/qualify_f017_m1f0_q5_k_real.py \
            --repository-root . \
            --synthetic-only
          echo "M1-F0 Q5_K gate: three independent scale/quant fixtures exact; public real-byte qualification evidence hash-bound"
          .venv/bin/python scripts/research/generate_f017_m1f0_input.py \
            --output specs/017-rust-native-inference-runtime/fixtures/f017-m1f0-layer3-input-v1.json \
            --check
          .venv/bin/python scripts/research/validate_f017_m1f0_package.py \
            --repository-root . \
            --execution-config docs/architecture/reviews/evidence/f017-m1-f0-attempt-2-execution-config-v1.json
          M1F0_CONFIG=docs/architecture/reviews/evidence/f017-m1-f0-attempt-2-execution-config-v1.json
          M1F0_CONFIG_SHA=$(shasum -a 256 "$M1F0_CONFIG" | awk '{print $1}')
          M1F0_AUTH=docs/architecture/reviews/evidence/f017-m1-f0-attempt-2-authorization-v1.json
          M1F0_AUTH_SHA=$(shasum -a 256 "$M1F0_AUTH" | awk '{print $1}')
          .venv/bin/python scripts/research/f017_m1f0_admission.py \
            --repository-root . \
            --m1f0-preflight-only \
            --execution-config "$M1F0_CONFIG" \
            --execution-config-sha256 "$M1F0_CONFIG_SHA" \
            --authorization "$M1F0_AUTH" \
            --authorization-sha256 "$M1F0_AUTH_SHA"
          if test -f docs/architecture/reviews/evidence/f017-m1-f0-layer3-route-v1.json; then
            .venv/bin/python scripts/research/validate_f017_m1f0_accepted_evidence.py \
              --repository-root .
          fi
          echo "M1-F0 synthetic attention/router: 10 deterministic discoveries; exact top-8 and routing bytes"
          .venv/bin/python scripts/research/f017_m1f0_admission.py \
            --repository-root . \
            --synthetic-stress \
            --input-fixture specs/017-rust-native-inference-runtime/fixtures/f017-m1f0-layer3-input-v1.json \
            --output "$RUNNER_TEMP/f017-m1-f0-stress-v1.json"
          echo "M1-F0 historical-route rejection and tensor-access isolation negatives executed; no skip"
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_m1f0_new_input_selection -v
          .venv/bin/python scripts/research/validate_f017_real_payload_ledger.py \
            --check docs/architecture/reviews/evidence/f017-real-payload-access-ledger-v1.json
          .venv/bin/python scripts/research/validate_f017_estimator_ladder_binding.py
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_route_stability_v2 -v
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_v2_antecedent_recovery \
            scripts.research.tests.test_bank_f017_v2_antecedent_recovery -v
          .venv/bin/python scripts/research/validate_f017_v2_summary_integrity.py \
            --repository-root .
          .venv/bin/python scripts/research/f017_v2_antecedent_recovery.py \
            --repository-root . \
            --synthetic \
            --output "$RUNNER_TEMP/f017-v2-antecedent-recovery-synthetic.json"
          echo "F017 v2 final: ordered top-8, bias-addition rounding, sigmoid endpoints, independent parity, support ceiling, slice catalog cross-check"
          echo "F017 v2 recovery: 12 synthetic payloads, 1984 membership bounds, 7 adjacent-order bounds, no route and no attempt consumption"
          echo "F017 v2 summary integrity: full-scan extrema, six-field mutation matrix, detail-derived authority; no skip"
          cargo test -p f017-runner dispatch_accounting -- --nocapture
          echo "M1-F0 route-stability research: v1 regression retained; v2 pairwise/RMSNorm/sigmoid/full-set/parity gates; no checkpoint access"
          for seed in 17017007 17017008 17017009 17017010 17017011 17017012 17017013 17017014; do
            .venv/bin/python scripts/research/generate_f017_m1f0_ladder_input.py \
              --seed "$seed" \
              --output "specs/017-rust-native-inference-runtime/fixtures/f017-m1f0-layer3-input-seed-${seed}-v1.json" \
              --check
          done
          echo "M1-F0 new-input planning: deterministic ladder, complete access ledger, extensible retention, unchanged S>=4 gate; no checkpoint access"
          echo "M1-E and M1-D regressions remain load-bearing in adjacent gates"
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute F017 exact and Tier-B numerical ladder
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_tierb_stress \
            scripts.research.tests.test_f017_r8_oracle \
            scripts.research.tests.test_f017_r9_oracle \
            scripts.research.tests.test_f017_r10_oracle \
            scripts.research.tests.test_f017_r11_oracle \
            scripts.research.tests.test_f017_r12_tiny_model -v
          cargo test -p f017-runner --test r7_exact_scaffold -- --nocapture
          cargo test -p f017-runner --test r7_production_attribution -- --nocapture
          cargo test -p f017-runner --test tier_b_stress_native -- --nocapture
          cargo test -p f017-runner --test r8_top8_shared_native -- --nocapture
          cargo test -p f017-runner --test r9_contract -- --nocapture
          cargo test -p f017-runner --test r9_exact_scaffold -- --nocapture
          cargo test -p f017-runner --test r9_production_native -- --nocapture
          cargo test -p f017-runner --test r10_contract -- --nocapture
          cargo test -p f017-runner --test r10_exact_scaffold -- --nocapture
          cargo test -p f017-runner --test r10_production_native -- --nocapture
          cargo test -p f017-runner --test r11_contract -- --nocapture
          cargo test -p f017-runner --test r11_exact_scaffold -- --nocapture
          cargo test -p f017-runner --test r11_production_native -- --nocapture
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_runs_r12_tiny_model_in_exact_and_production_modes \
            -- --exact --nocapture
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_cancels_r12_before_and_between_layers_without_false_pass \
            -- --exact --nocapture
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_banks_backend_failure_after_reconciling_adapter_lifecycle \
            -- --exact --nocapture
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_fails_closed_on_r12_tensor_contract_corruption \
            -- --exact --nocapture
          cargo test -p f017-runner --test checkpoint_runner \
            actual_binary_rejects_truncated_r12_shard_before_execution \
            -- --exact --nocapture
          python3 scripts/research/reconcile_f017_numerical_classification.py
          python3 scripts/research/validate_f017_numerical_classification.py \
            specs/017-rust-native-inference-runtime/fixtures/f017-r7-tier-b-result-v1.json \
            docs/architecture/reviews/evidence/f017-r8-top8-shared-production-v1.json \
            docs/architecture/reviews/evidence/f017-r9-mla-dsa-production-v1.json \
            docs/architecture/reviews/evidence/f017-r10-complete-layer-production-v1.json
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify vectorized IQ2_XXS decoder on synthetic blocks
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          uv run --frozen python -m unittest discover \
            -s scripts/research/tests \
            -p test_iq2_xxs_numpy.py \
            -v
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify checkpoint-free F017 routing contract v3
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          uv run --frozen python -m unittest discover \
            -s scripts/research/tests \
            -p 'test_f017_routing_contract_v3*.py' \
            -v
          uv run --frozen python -m scripts.research.f017_routing_contract_v3 \
            --source-trace \
            --output "$RUNNER_TEMP/f017-routing-v3-source-trace.json"
          cmp \
            "$RUNNER_TEMP/f017-routing-v3-source-trace.json" \
            docs/architecture/reviews/evidence/f017-routing-contract-v3-source-trace-v1.json
          test "$(shasum -a 256 specs/017-rust-native-inference-runtime/contracts/f017-m1f-routing-contract-v3.json | awk '{print $1}')" = \
            "befbf30f85e12b779e7d5c778f337a5f7d6019a15805e04805a24e4903ea3969"
          test "$(shasum -a 256 specs/017-rust-native-inference-runtime/contracts/f017-m1f-routing-contract-v3-clarified.json | awk '{print $1}')" = \
            "c5662a611abc000703606d799a7214ee27e39c556bc6595f217c86498e944a85"
          uv run --frozen python -m unittest -v \
            scripts.research.tests.test_f017_post_v3_estimator \
            scripts.research.tests.test_f017_post_v3_estimator_evidence \
            scripts.research.tests.test_f017_post_v3_fixture_descriptors \
            scripts.research.tests.test_f017_post_v3_correlated_family \
            scripts.research.tests.test_f017_m1f_route_independent_prep \
            scripts.research.tests.test_f017_post_m1f_downstream
          uv run --frozen python scripts/research/f017_post_v3_estimator.py \
            --family frozen_random_normal \
            --sample-count 1000000 \
            --contract specs/017-rust-native-inference-runtime/contracts/f017-m1f0-v3-membership-estimator-v1.json \
            --output "$RUNNER_TEMP/f017-m1f0-v3-frozen-ladder-estimate-v1.json"
          cmp \
            "$RUNNER_TEMP/f017-m1f0-v3-frozen-ladder-estimate-v1.json" \
            docs/architecture/reviews/evidence/f017-m1f0-v3-frozen-ladder-estimate-v1.json
          uv run --frozen python scripts/research/bank_f017_post_v3_correlated_estimate.py \
            --planning-contract specs/017-rust-native-inference-runtime/contracts/f017-m1f0-v3-correlated-family-planning-v1.json \
            --sample-count 1000000 \
            --output "$RUNNER_TEMP/f017-m1f0-v3-correlated-family-estimate-v1.json"
          cmp \
            "$RUNNER_TEMP/f017-m1f0-v3-correlated-family-estimate-v1.json" \
            docs/architecture/reviews/evidence/f017-m1f0-v3-correlated-family-estimate-v1.json
          cargo test -p f017-runner dispatch_accounting -- --nocapture
          echo 'F017_ROUTING_V3_SEMANTICS=ORDER_IS_NUMERICALLY_OBSERVABLE_NOT_MODEL_SEMANTIC'
          echo 'F017_ROUTING_V3_DENOMINATOR_ROUNDING=ENCLOSED'
          echo 'F017_ROUTING_V3_ACCUMULATION_SCOPE=EIGHT_ROUTED_TERMS_ONLY'
          echo 'F017_POST_V3_FROZEN_LADDER=NOT_VIABLE'
          echo 'F017_POST_V3_CORRELATED_FAMILY=NOT_VIABLE'
          echo 'F017_M1F_ROUTE_INDEPENDENT_PREP=PASS'
          echo 'F017_POST_M1F_DOWNSTREAM_PREP=PASS'
          echo 'F017_ROUTING_V3_ATOMIC_PAIRS=PASS'
          echo 'F017_ROUTING_V3_WEIGHT_QUALIFICATION=PASS'
          echo 'F017_ROUTING_V3_ACCUMULATION_ORDER=PASS'
          echo 'F017_ROUTING_V3_FALSE_PASS_NEGATIVES=PASS'
          echo 'F017_ROUTING_V3_FIXTURE1_ZERO_READ_RETROSPECTIVE=PASS'
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify checkpoint-free F017 dense-prefix and decoded-reuse preparation
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          uv run --frozen python -m unittest -v \
            scripts.research.tests.test_f017_decoded_tensor_reuse_v2 \
            scripts.research.tests.test_f017_colibri_comparative_audit \
            scripts.research.tests.test_f017_m1f_minus1_dense_prefix_prep \
            scripts.research.tests.test_f017_q6_q4_gate_preparation \
            scripts.research.tests.test_f017_q4_k_not_executed_preflight \
            scripts.research.tests.test_f017_q4_k_authorization_amendment \
            scripts.research.tests.test_f017_q4_k_real_execution \
            scripts.research.tests.test_f017_q4_state_q6_authorization \
            scripts.research.tests.test_f017_q6_k_real_execution \
            scripts.research.tests.test_f017_dense_prefix_authorization_preparation \
            scripts.research.tests.test_f017_dense_prefix_preparation \
            scripts.research.tests.test_f017_m1f_route_independent_prep \
            scripts.research.tests.test_f017_post_m1f_downstream
          cargo test -p quant --test q6_k_reference -- --nocapture
          cargo test -p f017-runner q4_k_decoder -- --nocapture
          .venv/bin/python scripts/research/validate_f017_real_payload_ledger.py \
            --check docs/architecture/reviews/evidence/f017-real-payload-access-ledger-v1.json
          .venv/bin/python -m scripts.research.validate_f017_q4_k_repository_evidence \
            --repository-root . \
            --evidence docs/architecture/reviews/evidence/f017-q4-k-real-byte-qualification-attempt-1-v1.json
          .venv/bin/python -m scripts.research.validate_f017_q6_k_repository_evidence \
            --repository-root . \
            --evidence docs/architecture/reviews/evidence/f017-q6-k-real-byte-qualification-attempt-1-v1.json
          test "$(.venv/bin/python -c 'import json; print(json.load(open("docs/architecture/reviews/evidence/f017-real-payload-access-ledger-v1.json"))["cumulative_tensor_payloads"])')" = 59
          echo 'F017_DECODED_REUSE=MIXED_POLICY_READY_FOR_FUTURE_AUTHORIZATION'
          echo 'F017_DENSE_PREFIX=PREPARED_NOT_AUTHORIZED'
          echo 'F017_Q4_K=EXACT_REAL_BYTE_QUALIFIED'
          echo 'F017_Q6_K=EXACT_REAL_BYTE_QUALIFIED'
          echo 'F017_Q6_K_CONTROL=CONSUMED_EXECUTED_EXACT_REAL_BYTE_QUALIFIED'
          echo 'F017_DENSE_PREFIX_AUTHORIZATION=BLOCKED_QUALIFIED_REUSE_HASH_ONLY_DESCRIPTOR'
          echo 'F017_Q4_K_ATTEMPT_STATE=CONSUMED_EXECUTED'
          echo 'F017_Q4_K_REAL_1=EXACT_REAL_BYTE_QUALIFIED_LEDGER_58'
          echo 'F017_COLIBRI_AUDIT=PINNED_ACTIONABLE_NO_SOURCE_COPY'
          echo 'F017_DECODED_REUSE_USE_CASES=SEPARATE_PACKAGES_REQUIRED'
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Test bounded worker contract
        run: |
          PYTHONPATH=python .venv/bin/python -m unittest discover \
            -s python/pulsar_mlx_worker/tests -v
      - name: Execute Rust-to-worker generated router integration
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          PULSARMLX_MODEL_GGUF='' cargo test -p mlx-backend \
            --test router_worker_integration \
            real_python_worker_two_row_router_matches_committed_golden -- \
            --ignored --exact
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute native MLX device smoke
        run: |
          cargo test -p mlx-backend --test device_smoke \
            native_device_smoke_command_emits_evaluated_evidence -- \
            --ignored --exact
      - name: Execute bounded MLX tensor fixtures
        run: |
          cargo run -p mlx-backend --bin pulsar-mlx -- validate-fixtures \
            --manifest fixtures/mlx/manifest.json \
            --evidence "$RUNNER_TEMP/mlx-tensor-fixtures.json"
      - name: Execute synthetic routed-MoE fixture
        run: |
          cargo run -p mlx-backend --bin pulsar-mlx -- validate-synthetic-moe \
            --fixture fixtures/mlx/routed-moe-v1.json \
            --evidence "$RUNNER_TEMP/synthetic-moe-v1.json"
      - name: Verify bounded evidence and external-model exclusion
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          tensor = json.loads((root / "mlx-tensor-fixtures.json").read_text())
          synthetic = json.loads((root / "synthetic-moe-v1.json").read_text())
          assert tensor["status"] == "passed"
          assert tensor["case_count"] == 7
          assert synthetic["status"] == "passed"
          assert synthetic["fixture_kind"] == "synthetic"
          assert synthetic["fallback_used"] is False
          assert os.environ.get("PULSARMLX_MODEL_GGUF", "") == ""
          PY
