  aggregate:
    name: CI aggregate status
    if: always()
    needs:
      - classify
      - evidence-integrity
      - documentation
      - closed-branch-guard
      - macos-15-arm64
      - apple-mlx-small-fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Enforce selected mode result
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          EVIDENCE_RESULT: ${{ needs.evidence-integrity.result }}
          DOCS_RESULT: ${{ needs.documentation.result }}
          GUARD_RESULT: ${{ needs.closed-branch-guard.result }}
          BASELINE_RESULT: ${{ needs.macos-15-arm64.result }}
          NATIVE_RESULT: ${{ needs.apple-mlx-small-fixtures.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success
          case "$MODE" in
            FULL_NATIVE)
              test "$BASELINE_RESULT" = success
              test "$NATIVE_RESULT" = success
              ;;
            EVIDENCE_ONLY)
              test "$EVIDENCE_RESULT" = success
              test "$BASELINE_RESULT" = skipped
              test "$NATIVE_RESULT" = skipped
              ;;
            DOCS_ONLY)
              test "$DOCS_RESULT" = success
              test "$BASELINE_RESULT" = skipped
              test "$NATIVE_RESULT" = skipped
              ;;
            NO_CHANGES)
              test "$BASELINE_RESULT" = skipped
              test "$NATIVE_RESULT" = skipped
              ;;
            CLOSED_BRANCH_GUARD)
              test "$GUARD_RESULT" = failure
              echo 'Closed-branch guard correctly refused automatic implementation qualification.'
              exit 1
              ;;
            UNKNOWN_DEFAULT_FULL)
              test "$BASELINE_RESULT" = success
              test "$NATIVE_RESULT" = success
              ;;
            *)
              echo "Unknown CI mode: $MODE" >&2
              exit 1
              ;;
          esac
          printf 'selected_mode=%s\n' "$MODE"
