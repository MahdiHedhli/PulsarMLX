name: macOS baseline

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: CI routing override (evidence cannot override code classification)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - full
          - evidence

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify committed change
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.route.outputs.mode }}
      base: ${{ steps.route.outputs.base }}
      head: ${{ steps.route.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: route
        name: Select fail-closed CI mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REQUESTED_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          BASE_SHA="$EVENT_BEFORE"
          if test "$EVENT_NAME" = pull_request; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          if test -z "$BASE_SHA" || test "$BASE_SHA" = 0000000000000000000000000000000000000000; then
            DEFAULT_BRANCH="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
            BASE_SHA="$(git merge-base HEAD "origin/${DEFAULT_BRANCH:-main}" 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          python3 scripts/ci/classify_ci_change.py \
            --repository . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$BRANCH" \
            --requested-mode "$REQUESTED_MODE" \
            --output-json "$RUNNER_TEMP/ci-classification.json" \
            --github-output "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/ci-classification.json"
          cat "$RUNNER_TEMP/ci-classification.json" >> "$GITHUB_STEP_SUMMARY"

  evidence-integrity:
    name: Evidence integrity
    needs: classify
    if: needs.classify.outputs.mode == 'EVIDENCE_ONLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate append-only committed evidence
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ATTEMPT_FLAG=--skip-attempt1
          if test -f docs/architecture/reviews/evidence/f017-native-bounded-p1-real-attempt-01-execution-evidence-v1.json; then
            ATTEMPT_FLAG=
          fi
          python3 -m scripts.ci.validate_evidence_change \
            --repository . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$BRANCH" \
            --output "$RUNNER_TEMP/evidence-validation-summary.json" \
            $ATTEMPT_FLAG
          cat "$RUNNER_TEMP/evidence-validation-summary.json"
          cat "$RUNNER_TEMP/evidence-validation-summary.json" >> "$GITHUB_STEP_SUMMARY"

  documentation:
    name: Documentation integrity
    needs: classify
    if: needs.classify.outputs.mode == 'DOCS_ONLY'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate documentation-only diff
        env:
          BASE_SHA: ${{ needs.classify.outputs.base }}
          HEAD_SHA: ${{ needs.classify.outputs.head }}
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test -z "$(git diff --raw "$BASE_SHA" "$HEAD_SHA" | awk '$2=="120000" || $3=="120000" {print}' || true)"
          git diff --name-status "$BASE_SHA" "$HEAD_SHA"

  closed-branch-guard:
    name: Closed F017 branch guard
    needs: classify
    if: needs.classify.outputs.mode == 'CLOSED_BRANCH_GUARD'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse automatic implementation qualification
        run: |
          echo 'The closed F017 proof/reference branch cannot auto-qualify implementation-affecting changes.' >&2
          echo 'Use an explicit, separately authorized workflow_dispatch full qualification.' >&2
          exit 1

  macos-15-arm64:
    name: Apple Silicon workspace baseline
    needs: classify
    if: needs.classify.outputs.mode == 'FULL_NATIVE' || needs.classify.outputs.mode == 'UNKNOWN_DEFAULT_FULL'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture and toolchain
        run: |
          uname -m
          sw_vers
          rustc -Vv
          cargo -V
          test "$(uname -m)" = arm64
      - name: Check workspace
        # f017-native deliberately has no non-native implementation: its
        # public executor surface is compiled only after the pinned MLX/MLX-C
        # installation in the dedicated qualification job below. Keep the
        # general baseline explicit rather than silently compiling a stub.
        run: cargo check --workspace --exclude f017-native --all-targets
      - name: Test workspace
        run: cargo test --workspace --exclude f017-native --no-fail-fast

  apple-mlx-small-fixtures:
    name: Apple MLX small-fixture validation
    needs: classify
    if: needs.classify.outputs.mode == 'FULL_NATIVE' || needs.classify.outputs.mode == 'UNKNOWN_DEFAULT_FULL'
    runs-on: macos-15
    env:
      PULSARMLX_MODEL_GGUF: ""
      PULSAR_REQUIRE_NATIVE_MLX: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence records pin the verifier/generator sources at their
          # measured commit. Later verifier changes therefore need history to
          # validate those immutable source hashes in fixture-only CI.
          fetch-depth: 0
      - name: Verify Apple Silicon fixture-only boundary
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test -z "$PULSARMLX_MODEL_GGUF"
          test -f uv.lock
          test -f fixtures/mlx/manifest.json
          test -f fixtures/mlx/routed-moe-v1.json
          test -f docs/validation/mlx-device-smoke.json
          test -f docs/validation/mlx-tensor-fixtures.json
          test -f docs/validation/synthetic-moe-v1.json
      - name: Build pinned official native MLX dependencies
        run: |
          brew install cmake ninja
          scripts/ci/install_native_mlx.sh "$RUNNER_TEMP/pulsar-native-mlx"
          echo "MLX_C_PREFIX=$RUNNER_TEMP/pulsar-native-mlx" >> "$GITHUB_ENV"
          echo "MLX_PREFIX=$RUNNER_TEMP/pulsar-native-mlx" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/pulsar-native-mlx/lib" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,$RUNNER_TEMP/pulsar-native-mlx/lib" >> "$GITHUB_ENV"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.13.13"
          enable-cache: true
      - name: Sync lockfile-backed MLX environment
        run: |
          uv python install 3.13.13
          uv sync --frozen --python 3.13.13
          .venv/bin/python - <<'PY'
          import platform
          import sys
          from importlib.metadata import version

          assert platform.machine() == "arm64"
          assert sys.version_info[:3] == (3, 13, 13)
          assert version("mlx") == "0.32.0"
          assert version("mlx-metal") == "0.32.0"
          assert version("numpy") == "2.4.5"
          PY
      - name: Build exact native F017 producer targets
        run: cargo build -p f017-native --release --all-targets
      - name: Test exact native F017 producer targets
        run: cargo test -p f017-native --release --no-fail-fast
      - name: Test evidence-aware CI routing and integrity tooling
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Validate Feature 002 research methodology
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          scripts/research/setup.sh
          .venv/bin/python -m unittest discover -s scripts/research/tests -v
          python3 scripts/research/validate_evidence.py \
            --schema-dir schemas/research/v1 \
            --input fixtures/research/router-v1/evidence
          python3 scripts/research/verify_package.py \
            --feature 002-qwen-router-parity \
            --fixture-only
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Validate independent Feature 017 oracle
        run: |
          .venv/bin/python scripts/research/validate_f017_oracle_independence.py
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_independent_oracle -v
          .venv/bin/python -m unittest \
            scripts.research.tests.test_validate_f017_oracle_independence -v
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_p1_admission -v
          .venv/bin/python scripts/research/generate_f017_independent_oracle.py \
            --generator-commit a9779097de029f26be1cb9fde3543cc517ff153e \
            --output specs/017-rust-native-inference-runtime/fixtures/f017-independent-oracle-v1.json \
            --rust-output crates/engine/src/f017_oracle_generated.rs \
            --check
          cargo test -p engine --test f017_independent_oracle -- --nocapture
      - name: Validate retained D3.5 authority and numerical grading
        run: |
          .venv/bin/python - <<'PY'
          import importlib.util
          from pathlib import Path

          path = Path("scripts/research/validate_f017_native_d35_comparison_grant_v1.py")
          spec = importlib.util.spec_from_file_location("f017_d35_grant", path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.validate(
              resolve_executable=False,
              resolve_machine_local=False,
              require_pre_event_root_absent=False,
          )
          assert result["result"] == "PASS_COMMITTED_STRUCTURE_ONLY"
          assert result["validation_scope"] == "COMMITTED_STRUCTURE_ONLY_NOT_EXECUTION_AUTHORITY"
          assert result["read_census"] == 89
          assert result["original_checkpoint_reads"] == 0
          PY
          .venv/bin/python scripts/research/validate_f017_native_d35_numerical_grading_v1.py
          .venv/bin/python -m unittest \
            scripts.research.tests.test_f017_native_d35_comparison_grant_v1 \
            scripts.research.tests.test_f017_native_d35_numerical_grading_v1 \
            -v
      - name: Execute required native MLX adapter matrix
        run: |
          echo "PULSAR_REQUIRE_NATIVE_MLX=1; executing native adapter tests (no skip permitted)"
          test -f "$MLX_C_PREFIX/include/mlx/c/mlx.h"
          test -f "$MLX_C_PREFIX/lib/libmlxc.dylib"
          test -f "$MLX_PREFIX/lib/libmlx.dylib"
          cargo test -p stream --test apple_mlx_bridge -- --nocapture
          cargo test -p stream --test apple_metal_bridge -- --nocapture
          cargo test -p stream --lib -- --nocapture
      - name: Execute receipt-v2 synthetic full-model qualification
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          cargo build -p f017-native --release --bin f017-native-synthetic-p1
          SOURCE_BINARY=target/release/f017-native-synthetic-p1
          SOURCE_AUTHORITY="$RUNNER_TEMP/f017-native-synthetic-source-authority.json"
          .venv/bin/python scripts/research/build_f017_native_synthetic_inert_authority.py \
            --template specs/017-rust-native-inference-runtime/fixtures/f017-native-tiny-full-model-inert-authority-v2.json \
            --binary "$SOURCE_BINARY" \
            --execution-code-head "$(git rev-parse HEAD)" \
            --authorization-id F017-NATIVE-TINY-FULL-MODEL-CI-AUTHORITY-3 \
            --attempt-id F017-NATIVE-TINY-FULL-MODEL-CI-ATTEMPT-3 \
            --output "$SOURCE_AUTHORITY"
          .venv/bin/python scripts/research/qualify_f017_native_full_model_synthetic_v2.py \
            --binary "$SOURCE_BINARY" \
            --fixture specs/017-rust-native-inference-runtime/fixtures/f017-native-tiny-full-model-v1.json \
            --authority "$SOURCE_AUTHORITY" \
            --output-root "$RUNNER_TEMP/f017-native-synthetic-v2" \
            --evidence-output "$RUNNER_TEMP/f017-native-synthetic-v2-evidence.json" \
            --execution-code-head "$(git rev-parse HEAD)" \
            --fresh-processes 10
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "f017-native-synthetic-v2-evidence.json").read_text()
          )
          assert evidence["result"] == "PASS"
          assert evidence["receipt_schema"] == "pulsarmlx.f017.native-bounded-p1-execution-receipt/2.0.0"
          assert evidence["fresh_processes"] == 10
          assert evidence["summary_byte_identity"] == "EXACT_10_OF_10"
          assert evidence["original_checkpoint_reads"] == 0
          assert evidence["real_m1_ultra_p1_executed"] is False
          PY
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify attempt-1 offline diagnostics and forward evidence
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify corrected oracle historical and active authority split
        run: |
          set -euo pipefail
          test -z "$PULSARMLX_MODEL_GGUF"
          cargo test -p stream p1_domain --no-default-features
          .venv/bin/python scripts/research/qualify_f017_corrected_oracles.py \
            --output "$RUNNER_TEMP/f017-corrected-oracle-qualification.json"
          .venv/bin/python scripts/research/validate_f017_historical_corrected_oracle_authorities_v6.py
          .venv/bin/python scripts/research/extract_f017_corrected_oracle_numerics_v2.py
          .venv/bin/python scripts/research/extract_f017_corrected_oracle_target_sources_v6.py
          .venv/bin/python scripts/research/generate_f017_numerical_capability_authorities_v1.py
          git diff --exit-code -- \
            specs/017-rust-native-inference-runtime/contracts/f017-corrected-oracle-numerical-capability-policy-v1.json \
            specs/017-rust-native-inference-runtime/contracts/f017-corrected-oracle-receiver-provenance-v1.json \
            specs/017-rust-native-inference-runtime/contracts/f017-corrected-oracle-numerical-capability-use-manifest-v1.json \
            docs/architecture/reviews/evidence/f017-corrected-oracle-numerical-capability-bytecode-audit-v1.json
          .venv/bin/python scripts/research/validate_f017_corrected_oracle_numerical_authority_v3.py
          .venv/bin/python scripts/research/qualify_f017_numerical_capability_policy_v1.py \
            --output "$RUNNER_TEMP/f017-corrected-oracle-numerical-capability-qualification-v1.json"
          cmp \
            "$RUNNER_TEMP/f017-corrected-oracle-numerical-capability-qualification-v1.json" \
            docs/architecture/reviews/evidence/f017-corrected-oracle-numerical-capability-qualification-v1.json
          .venv/bin/python scripts/research/validate_f017_corrected_oracle_geometry.py \
            specs/017-rust-native-inference-runtime/contracts/f017-corrected-full-checkpoint-oracle-geometry-v1.json \
            crates/f017-native/src/model.rs
          .venv/bin/python scripts/research/validate_f017_attempt_2_template.py \
            specs/017-rust-native-inference-runtime/contracts/f017-native-bounded-p1-attempt-02-template-v1.json \
            --expect-blocked
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"f017-corrected-oracle-qualification.json").read_text())
          assert result["result"]=="PASS"
          assert result["original_checkpoint_shard_opens"]==0
          assert result["original_checkpoint_payload_reads"]==0
          assert result["mutation_count"]==16
          PY
          test -z "$PULSARMLX_MODEL_GGUF"
          .venv/bin/python -m pytest -q \
            scripts/research/tests/test_audit_f017_native_checkpoint_plan.py \
            scripts/research/tests/test_f017_q6_oracle_lane_order.py \
            scripts/research/tests/test_f017_iq3_oracle_lane_order.py \
            scripts/research/tests/test_f017_iq4_xs_oracle_lane_order.py \
            scripts/research/tests/test_f017_corrected_oracle_instantiability_v3.py \
            scripts/research/tests/test_f017_corrected_oracle_preaccess.py \
            scripts/research/tests/test_f017_corrected_oracle_numerical_authority_v2.py \
            scripts/research/tests/test_f017_numerical_capability_policy_v1.py \
            scripts/research/tests/test_f017_numerical_output_interface_design_v1.py \
            scripts/research/tests/test_f017_numerical_output_interface_implementation_v1.py \
            scripts/research/tests/test_validate_f017_failure_evidence_v3.py \
            scripts/research/tests/test_f017_native_synthetic_family_v1.py
          .venv/bin/python scripts/research/audit_f017_native_checkpoint_plan.py \
            docs/validation/glm52-checkpoint.json \
            docs/research/glm52/raw/f016-c01-catalog-0001.json \
            --output "$RUNNER_TEMP/f017-plan-audit.json"
          cargo build -p f017-native --release \
            --bin quant_native_matvec_probe --bin synthetic_differential
          .venv/bin/python scripts/research/qualify_f017_corrected_oracle_numerical_authority_v3.py \
            --synthetic-binary target/release/synthetic_differential \
            --output "$RUNNER_TEMP/f017-corrected-oracle-numerical-requalification-v3.json"
          cmp \
            "$RUNNER_TEMP/f017-corrected-oracle-numerical-requalification-v3.json" \
            docs/architecture/reviews/evidence/f017-corrected-oracle-numerical-requalification-v3.json
          .venv/bin/python scripts/research/qualify_f017_numerical_output_interface_v4.py \
            --output "$RUNNER_TEMP/f017-corrected-oracle-numerical-requalification-v4.json"
          cmp \
            "$RUNNER_TEMP/f017-corrected-oracle-numerical-requalification-v4.json" \
            docs/architecture/reviews/evidence/f017-corrected-oracle-numerical-requalification-v4.json
          .venv/bin/python scripts/research/validate_f017_corrected_oracle_numerical_authority_v4.py
          .venv/bin/python -m pytest -q \
            scripts/research/tests/test_f017_result_envelope_v11.py \
            scripts/research/tests/test_f017_result_bundle_builder_v11.py
          .venv/bin/python scripts/research/validate_f017_result_envelope_design_v11.py
          .venv/bin/python scripts/research/validate_f017_result_authority_v11.py
          .venv/bin/python scripts/research/validate_f017_v11_execution_authority_v1.py
          .venv/bin/python scripts/research/generate_f017_v11_measurement_v1.py --check
          .venv/bin/python scripts/research/generate_f017_v11_authorities_v1.py --check
          .venv/bin/python scripts/research/generate_f017_event05_readiness_interface_manifest_v1.py --check
          .venv/bin/python scripts/research/validate_f017_event05_readiness_interface_design_v1.py
          .venv/bin/python scripts/research/qualify_f017_event05_readiness_interface_v1.py \
            --output "$RUNNER_TEMP/f017-event05-readiness-interface-qualification.json"
          cmp "$RUNNER_TEMP/f017-event05-readiness-interface-qualification.json" \
            docs/architecture/reviews/evidence/f017-event05-readiness-interface-qualification-v4.json
          .venv/bin/python scripts/research/qualify_f017_event04_diagnostic_v11.py \
            --output "$RUNNER_TEMP/f017-event04-diagnostic-v11.json"
          cmp "$RUNNER_TEMP/f017-event04-diagnostic-v11.json" \
            docs/architecture/reviews/evidence/f017-event04-diagnostic-fixture-qualification-v11-v1.json
          .venv/bin/python scripts/research/qualify_f017_v11_full_geometry_v1.py \
            --output "$RUNNER_TEMP/f017-v11-full-geometry.json"
          cmp "$RUNNER_TEMP/f017-v11-full-geometry.json" \
            docs/architecture/reviews/evidence/f017-v11-full-geometry-qualification-v2.json
          .venv/bin/python scripts/research/qualify_f017_v11_failure_campaign_v1.py \
            --output "$RUNNER_TEMP/f017-v11-result-failure-qualification.json"
          cmp "$RUNNER_TEMP/f017-v11-result-failure-qualification.json" \
            docs/architecture/reviews/evidence/f017-v11-result-failure-qualification-v2.json
          .venv/bin/python scripts/research/rehearse_f017_event05_v11.py \
            --output "$RUNNER_TEMP/f017-event05-v11-rehearsal.json"
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "f017-event05-v11-rehearsal.json").read_text())
          assert result["result"] == "PASS"
          assert result["state_created"] is False
          assert result["live_authority_created"] is False
          assert result["checkpoint_opens"] == 0
          assert result["checkpoint_reads"] == 0
          assert result["numerical_operations"] == 0
          PY
          WORKSPACE_ROOT="$PWD"
          V6_HISTORICAL_HEAD=ccf76d95ff33b333d2d40e29181a926528bc8ca6
          V6_HISTORICAL_WORKTREE="$RUNNER_TEMP/f017-v6-historical"
          cleanup_v6_historical_worktree() {
            git worktree remove --force "$V6_HISTORICAL_WORKTREE" >/dev/null 2>&1 || true
            git worktree prune
            if git worktree list --porcelain | grep -F "$V6_HISTORICAL_WORKTREE"; then
              echo "historical validation worktree survived cleanup" >&2
              return 1
            fi
          }
          trap cleanup_v6_historical_worktree EXIT
          git worktree add --detach "$V6_HISTORICAL_WORKTREE" "$V6_HISTORICAL_HEAD"
          (
            cd "$V6_HISTORICAL_WORKTREE"
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/generate_f017_lifecycle_v6_authorities.py --check
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/validate_f017_lifecycle_semantic_authority_v6.py
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/check_f017_lifecycle_v6_independent.py
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/validate_f017_event04_authority_reconciliation_v1.py \
              --scientific specs/017-rust-native-inference-runtime/contracts/f017-corrected-full-checkpoint-oracle-scientific-access-v6-binding-reconciliation-v3.json \
              --measurement docs/architecture/reviews/evidence/f017-corrected-oracle-lifecycle-v6-implementation-measurement-v5.json \
              --declaration docs/architecture/reviews/evidence/f017-event04-load-bearing-authority-binding-correction-v2.json \
              --inert specs/017-rust-native-inference-runtime/fixtures/f017-corrected-full-checkpoint-oracle-inert-authorization-v6-binding-reconciliation-v3.json \
              --authority-manifest specs/017-rust-native-inference-runtime/contracts/f017-event04-load-bearing-authority-manifest-v3.json \
              --run-mutations
            "$WORKSPACE_ROOT/.venv/bin/python" -m pytest -q \
              scripts/research/test_f017_lifecycle_semantics_v6.py \
              scripts/research/test_f017_lifecycle_v6_implementation.py
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/qualify_f017_corrected_oracle_target_adapters_v6.py \
              --repeats 10 \
              --output "$RUNNER_TEMP/f017-corrected-oracle-target-adapters-v6.json"
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/qualify_f017_lifecycle_v6.py \
              --success-repeats 10 \
              --failure-repeats 5 \
              --output "$RUNNER_TEMP/f017-corrected-oracle-lifecycle-v6.json"
            "$WORKSPACE_ROOT/.venv/bin/python" scripts/research/rehearse_f017_event04_authority_reconciliation_v1.py \
              --scientific specs/017-rust-native-inference-runtime/contracts/f017-corrected-full-checkpoint-oracle-scientific-access-v6-binding-reconciliation-v3.json \
