name: macOS baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-15-arm64:
    name: Apple Silicon workspace baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture and toolchain
        run: |
          uname -m
          sw_vers
          rustc -Vv
          cargo -V
          test "$(uname -m)" = arm64
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast

  apple-mlx-small-fixtures:
    name: Apple MLX small-fixture validation
    runs-on: macos-15
    env:
      PULSARMLX_MODEL_GGUF: ""
    steps:
      - uses: actions/checkout@v7
        with:
          # Evidence records pin the verifier/generator sources at their
          # measured commit. Later verifier changes therefore need history to
          # validate those immutable source hashes in fixture-only CI.
          fetch-depth: 0
      - name: Verify Apple Silicon fixture-only boundary
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          test -z "$PULSARMLX_MODEL_GGUF"
          test -f uv.lock
          test -f fixtures/mlx/manifest.json
          test -f fixtures/mlx/routed-moe-v1.json
          test -f docs/validation/mlx-device-smoke.json
          test -f docs/validation/mlx-tensor-fixtures.json
          test -f docs/validation/synthetic-moe-v1.json
      - name: Validate Feature 002 research methodology
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          scripts/research/setup.sh
          python3 -m unittest discover -s scripts/research/tests -v
          python3 scripts/research/validate_evidence.py \
            --schema-dir schemas/research/v1 \
            --input fixtures/research/router-v1/evidence
          python3 scripts/research/verify_package.py \
            --feature 002-qwen-router-parity \
            --fixture-only
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.17"
          python-version: "3.12.13"
          enable-cache: true
      - name: Sync lockfile-backed MLX environment
        run: |
          uv python install 3.12.13
          uv sync --frozen --python 3.12.13
          .venv/bin/python - <<'PY'
          import platform
          from importlib.metadata import version

          assert platform.machine() == "arm64"
          assert version("mlx") == "0.32.0"
          assert version("mlx-metal") == "0.32.0"
          assert version("numpy") == "2.4.5"
          PY
      - name: Qualify vectorized IQ2_XXS decoder on synthetic blocks
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          uv run --frozen python -m unittest discover \
            -s scripts/research/tests \
            -p test_iq2_xxs_numpy.py \
            -v
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Qualify GLM-5.3-Flash dense-FFN caller (synthetic, pinned MLX)
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          mkdir -p "$RUNNER_TEMP/flash-ffn-tmp"
          for flags in "-I -B" "-I -B -O"; do
            TMPDIR="$RUNNER_TEMP/flash-ffn-tmp" .venv/bin/python $flags \
              scripts/research/tests/test_glm53_flash_decoder_ffn.py \
              > "$RUNNER_TEMP/flash-ffn-$(echo $flags | tr -d ' -').stdout"
          done
          .venv/bin/python -I -B scripts/research/glm53_flash/decoder_ffn/regenerate_provenance.py --check
          for flags in "-I -B" "-I -B -O"; do
            TMPDIR="$RUNNER_TEMP/flash-ffn-tmp" .venv/bin/python $flags \
              scripts/research/tests/test_glm53_flash_decoder_ffn_compile.py \
              > "$RUNNER_TEMP/flash-ffn-compile-$(echo $flags | tr -d ' -').stdout"
          done
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Check GLM-5.3-Flash MoE track offline (stdlib only)
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          for flags in "-I -B" "-I -B -O"; do
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_moe.py \
              > "$RUNNER_TEMP/flash-moe-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_sparse.py \
              > "$RUNNER_TEMP/flash-sparse-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_stack.py \
              > "$RUNNER_TEMP/flash-stack-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_sparse_decode.py \
              > "$RUNNER_TEMP/flash-sparse-decode-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_stack_decode.py \
              > "$RUNNER_TEMP/flash-stack-decode-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_stack_sanitize.py \
              > "$RUNNER_TEMP/flash-stack-sanitize-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_quantized.py \
              > "$RUNNER_TEMP/flash-quantized-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_topology.py \
              > "$RUNNER_TEMP/flash-topology-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_linear_long.py \
              > "$RUNNER_TEMP/flash-linear-long-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_offload.py \
              > "$RUNNER_TEMP/flash-offload-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_load_offload.py \
              > "$RUNNER_TEMP/flash-load-offload-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_dogfood_entrypoint.py \
              > "$RUNNER_TEMP/flash-dogfood-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_quantized_load.py \
              > "$RUNNER_TEMP/flash-quantized-load-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_offload_pulsar.py \
              > "$RUNNER_TEMP/flash-offload-pulsar-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_decoder_slot_store.py \
              > "$RUNNER_TEMP/flash-slot-store-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_mtp_speculator.py \
              > "$RUNNER_TEMP/flash-mtp-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_serve_worker.py \
              > "$RUNNER_TEMP/flash-serve-worker-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_repack_v2.py \
              > "$RUNNER_TEMP/flash-repack-v2-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_serve_policy.py \
              > "$RUNNER_TEMP/flash-serve-policy-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_stop_policy.py \
              > "$RUNNER_TEMP/flash-stop-policy-$(echo $flags | tr -d ' -').stdout"
            .venv/bin/python $flags scripts/research/tests/test_glm53_flash_serve_offload.py \
              > "$RUNNER_TEMP/flash-serve-offload-$(echo $flags | tr -d ' -').stdout"
            PULSAR_REPLAY_TEST=1 .venv/bin/python $flags scripts/research/tests/test_glm53_flash_stream_prefill.py \
              > "$RUNNER_TEMP/flash-stream-prefill-$(echo $flags | tr -d ' -').stdout"
            PULSAR_REPLAY_TEST=1 .venv/bin/python $flags scripts/research/tests/test_glm53_flash_stream_prefill_policy.py \
              > "$RUNNER_TEMP/flash-stream-prefill-policy-$(echo $flags | tr -d ' -').stdout"
          done
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Test bounded worker contract
        run: |
          PYTHONPATH=python .venv/bin/python -m unittest discover \
            -s python/pulsar_mlx_worker/tests -v
      - name: Execute Rust-to-worker generated router integration
        run: |
          test -z "$PULSARMLX_MODEL_GGUF"
          PULSARMLX_MODEL_GGUF='' cargo test -p mlx-backend \
            --test router_worker_integration \
            real_python_worker_two_row_router_matches_committed_golden -- \
            --ignored --exact
          test -z "$PULSARMLX_MODEL_GGUF"
      - name: Execute native MLX device smoke
        run: |
          cargo test -p mlx-backend --test device_smoke \
            native_device_smoke_command_emits_evaluated_evidence -- \
            --ignored --exact
      - name: Execute bounded MLX tensor fixtures
        run: |
          cargo run -p mlx-backend --bin pulsar-mlx -- validate-fixtures \
            --manifest fixtures/mlx/manifest.json \
            --evidence "$RUNNER_TEMP/mlx-tensor-fixtures.json"
      - name: Execute synthetic routed-MoE fixture
        run: |
          cargo run -p mlx-backend --bin pulsar-mlx -- validate-synthetic-moe \
            --fixture fixtures/mlx/routed-moe-v1.json \
            --evidence "$RUNNER_TEMP/synthetic-moe-v1.json"
      - name: Verify bounded evidence and external-model exclusion
        run: |
          .venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          tensor = json.loads((root / "mlx-tensor-fixtures.json").read_text())
          synthetic = json.loads((root / "synthetic-moe-v1.json").read_text())
          assert tensor["status"] == "passed"
          assert tensor["case_count"] == 7
          assert synthetic["status"] == "passed"
          assert synthetic["fixture_kind"] == "synthetic"
          assert synthetic["fallback_used"] is False
          assert os.environ.get("PULSARMLX_MODEL_GGUF", "") == ""
          PY
