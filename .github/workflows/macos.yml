name: macOS baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-15-arm64:
    name: Apple Silicon workspace baseline
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Verify runner architecture and toolchain
        run: |
          uname -m
          sw_vers
          rustc -Vv
          cargo -V
          test "$(uname -m)" = arm64
      - name: Check workspace
        run: cargo check --workspace --all-targets
      - name: Test workspace
        run: cargo test --workspace --no-fail-fast
