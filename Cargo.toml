[workspace]
resolver = "2"
members = [
    "crates/gguf",
    "crates/stream",
    "crates/kernels",
    "crates/tokenizer",
    "crates/engine",
    "crates/serve",
    "crates/quant",
    "crates/backend",
    "crates/mlx-backend",
    "crates/f017-native",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/MahdiHedhli/PulsarMLX"

[profile.release]
lto = "thin"
codegen-units = 1
