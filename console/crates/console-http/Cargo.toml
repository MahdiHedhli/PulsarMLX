[package]
name = "console-http"
description = "HTTP transport, guards, inference driver and dialects for PulsarMLX Console"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
console-pyjson.workspace = true
console-core.workspace = true
console-tokenizer.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = [
    "rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros",
] }
httparse.workspace = true

[dev-dependencies]
console-engine = { workspace = true, features = ["test-support"] }
console-testkit.workspace = true
tokio = { workspace = true, features = [
    "rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros", "test-util",
] }
