[package]
name = "stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Expert streaming core: io_uring fetch engine (Linux)."

[dependencies]
gguf = { path = "../gguf" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"
