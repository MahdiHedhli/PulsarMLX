[package]
name = "stream"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Expert streaming core: io_uring fetch engine (Linux)."
build = "build.rs"

[dependencies]
gguf = { path = "../gguf" }
quant = { path = "../quant" }
serde_json = "1"
sha2 = "0.10"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
