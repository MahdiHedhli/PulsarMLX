[package]
name = "pulsar-serve-synthetic"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Synthetic-only OpenAI-style protocol server for PulsarMLX"

[workspace]

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.4"
hyper = { version = "=1.11.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "=0.1.19"

[dev-dependencies]
libc = "=0.2.189"
