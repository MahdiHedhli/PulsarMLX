[package]
name = "mlx-affine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Model-neutral MLX affine quantized weight representation over a Safetensors catalog."

[dependencies]
safetensors-catalog = { path = "../safetensors-catalog" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The header census example recomputes each supplied header's sha256 against
# the extractor's record. Already in the lock file through safetensors-catalog.
sha2 = "0.10"
