[package]
name = "mlx-expert-mlp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "F020 bounded synthetic expert MLP qualification; no serving or performance claim"
build = "build.rs"

[features]
default = []
resident-native = []
weighted-native = []

[dependencies]
mlx-expert-ranges = { path = "../mlx-expert-ranges" }
backend = { path = "../backend" }
mlx-native-affine = { path = "../mlx-native-affine" }
serde_json = "1"
libc = "0.2"

[build-dependencies]
cc = "1"

[[bin]]
name = "qualify-expert-mlp"
path = "src/main.rs"
test = false

[[bin]]
name = "qualify-resident-mlp"
path = "src/bin/qualify-resident-mlp.rs"
required-features = ["resident-native"]
test = false

[[bin]]
name = "qualify-weighted-mlp"
path = "src/bin/qualify-weighted-mlp.rs"
required-features = ["weighted-native"]
