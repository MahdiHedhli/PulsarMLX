[package]
name = "mlx-expert-mlp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "F020 bounded synthetic expert MLP qualification; no serving or performance claim"
build = "build.rs"

[dependencies]
mlx-native-affine = { path = "../mlx-native-affine" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
safetensors-catalog = { path = "../safetensors-catalog" }
libc = "0.2"

[build-dependencies]
cc = "1"

[[bin]]
name = "qualify-expert-mlp"
path = "src/main.rs"
test = false

[dev-dependencies]
mlx-expert-ranges = { path = "../mlx-expert-ranges" }
