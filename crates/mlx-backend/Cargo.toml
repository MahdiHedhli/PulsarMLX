[package]
name = "mlx-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
backend = { path = "../backend" }
gguf = { path = "../gguf" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"

[[bin]]
name = "pulsar-mlx"
path = "src/bin/pulsar-mlx.rs"
