[package]
name = "f017-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Canonical Rust-native Feature 017 GLM-5.2 runner."
build = "build.rs"

[dependencies]
backend = { path = "../backend" }
gguf = { path = "../gguf" }
quant = { path = "../quant" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
stream = { path = "../stream" }
libc = "0.2"

[[bin]]
name = "f017-glm52-runner"
path = "src/main.rs"

[[bin]]
name = "f017-dense-prefix-candidate"
path = "src/bin/f017-dense-prefix-candidate.rs"

[[bin]]
name = "f017-apple-serial-f32-capture"
path = "src/bin/f017-apple-serial-f32-capture.rs"
