[package]
name = "repack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bounded-memory deterministic GGUF expert-store repacker."

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[bin]]
name = "pulsar-repack"
path = "src/main.rs"
