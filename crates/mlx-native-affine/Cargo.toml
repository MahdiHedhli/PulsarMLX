[package]
name = "mlx-native-affine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "F020 Slice 2B: native MLX affine primitives (import, cast, dequantize, quantized_matmul) behind frozen refusals, qualified in a child process."
build = "build.rs"

# The library is pure Rust and never links MLX: refusals, kernel-family
# derivation, the frozen acceptance algorithms, population validation and the
# parent harness. Everything that calls MLX-C lives in the `qualify` binary,
# which is the only artifact linked against the pinned native prefix.
[dependencies]
serde_json = "1"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
# R1 (the independent binary64 reference) is consumed by the parent test only;
# the qualification child never links it.
mlx-affine = { path = "../mlx-affine" }

[build-dependencies]
cc = "1"

[[bin]]
name = "qualify"
path = "src/bin/qualify/main.rs"
