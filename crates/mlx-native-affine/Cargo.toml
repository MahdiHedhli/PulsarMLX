[package]
name = "mlx-native-affine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "F020 Slice 2B: native MLX affine primitives (import, cast, dequantize, quantized_matmul) behind frozen refusals, qualified in a child process."
build = "build.rs"

# The library is pure Rust and never links MLX: refusals, kernel-family
# derivation, the frozen acceptance algorithms, population validation and the
# parent harness. Everything that calls MLX-C lives in the `qualify` binary,
# which is the only artifact linked against the pinned native prefix.
[dependencies]
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
# F020 Slice 2C (slice2c-plan.md section 2.1): composition runs the Slice 1
# catalog, module resolution and checked selection, so both crates are normal
# dependencies and the `qualify` child links them. Neither links MLX or calls
# mlx_set_error_handler. R1 (`mlx_affine::reference_qmm`) is linked but never
# called from the child: a static source test and an `nm` symbol check of the
# built child enforce that (tests/composition_qualification.rs).
mlx-affine = { path = "../mlx-affine" }
safetensors-catalog = { path = "../safetensors-catalog" }

[build-dependencies]
cc = "1"

[[bin]]
name = "qualify"
path = "src/bin/qualify/main.rs"

# F020 Slice 2C composition parent. `test = false` keeps it out of the Slice 2B
# step's `cargo test -p mlx-native-affine` inventory; the Slice 2C step runs it
# explicitly with `--test composition_qualification`.
[[test]]
name = "composition_qualification"
path = "tests/composition_qualification.rs"
test = false
