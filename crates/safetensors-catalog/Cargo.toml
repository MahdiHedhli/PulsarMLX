[package]
name = "safetensors-catalog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Model-neutral Safetensors header, index and catalog reader with checked byte ranges."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
backend = { path = "../backend" }
