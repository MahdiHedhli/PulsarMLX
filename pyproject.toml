[project]
name = "pulsar-mlx-worker"
version = "0.1.0"
description = "Reference MLX worker for the PulsarMLX Apple Silicon backend"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "mlx==0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy==2.2.6; python_version < '3.11'",
    "numpy==2.4.5; python_version >= '3.11'",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["uv_build==0.11.17"]
build-backend = "uv_build"

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.build-backend]
module-root = "python"
